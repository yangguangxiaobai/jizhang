packages:
  - 'packages/*'

# pnpm 10 does NOT run a dependency's install/postinstall script unless the
# dependency is listed here. better-sqlite3 is a native C++ addon: skipping its
# install script ships an image where `require('better-sqlite3')` throws
# MODULE_NOT_FOUND. This list is load-bearing for acceptance criterion AC7 —
# do not remove entries, and never pass --ignore-scripts to pnpm install.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
