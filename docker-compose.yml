# The app publishes on loopback only; the private CPU cutout worker has no
# published ports and is reachable only over its dedicated internal network.
# The host reverse proxy keeps ownership of 80/443.
services:
  jizhang:
    build:
      context: .
      dockerfile: Dockerfile
    image: jizhang:latest
    container_name: jizhang
    restart: unless-stopped

    # .env is optional at the compose layer so the failure the operator sees is
    # the server's own configuration report (AC12), not a compose error.
    # `cp .env.example .env` before the first `up`.
    env_file:
      - path: .env
        required: false

    environment:
      # Calendar math (budget cycle day, month labels) is local-time. Without this
      # the container runs UTC and a China-midnight timestamp lands on the previous day.
      TZ: Asia/Shanghai
      NODE_ENV: production
      PORT: '8081'
      DATA_DIR: /data
      WEB_DIST_DIR: /app/public
      NODE_OPTIONS: --max-old-space-size=256
      LOG_LEVEL: '${LOG_LEVEL:-info}'
      TRUST_PROXY: '${TRUST_PROXY:-true}'
      JIZHANG_ITEM_CUTOUT_SERVICE_URL: http://jizhang-cutout:8090

    volumes:
      # Named volume (not a host bind mount) so /data is initialised with the
      # image's ownership and the non-root `node` user can write the SQLite
      # file. A bind mount needs `mkdir -p data && sudo chown 1000:1000 data`
      # on the host first — see README "Data directory" for the alternative.
      - jizhang-data:/data

    ports:
      # 127.0.0.1 HARD-CODED on purpose: never 80/443, never 0.0.0.0 (design.md §7.2).
      - '127.0.0.1:8081:8081'

    networks:
      - default
      - cutout-internal

  jizhang-cutout:
    build:
      context: .
      dockerfile: packages/cutout/Dockerfile
      target: runtime
      args:
        PYTHON_PACKAGE_INDEX_URL: '${PYTHON_PACKAGE_INDEX_URL:-https://pypi.org/simple}'
    image: jizhang-cutout:latest
    container_name: jizhang-cutout
    restart: unless-stopped
    init: true
    environment:
      JIZHANG_CUTOUT_CHECKPOINT: /opt/models/sam2.1_hiera_small.pt
      JIZHANG_CUTOUT_CONFIG: configs/sam2.1/sam2.1_hiera_s.yaml
      JIZHANG_CUTOUT_TMP_DIR: /tmp/jizhang-cutout-jobs
      JIZHANG_CUTOUT_POINTS_PER_SIDE: '8'
      JIZHANG_CUTOUT_POINTS_PER_BATCH: '8'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2.0
    tmpfs:
      - /tmp/jizhang-cutout-jobs:rw,noexec,nosuid,size=512m,uid=10001,gid=10001,mode=0700
    networks:
      - cutout-internal

volumes:
  jizhang-data:

networks:
  default: {}
  cutout-internal:
    internal: true
