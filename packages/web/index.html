<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the layout reach under the notch/home indicator, which
      the safe-area insets in main.css then account for.

      Zoom is NOT disabled: `user-scalable=no` would break pinch-zoom for anyone who
      needs it. The iOS focus-zoom problem is solved the correct way instead — every
      form control is at least 16px, which is what Safari keys off.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2f6f8f" />
    <meta
      name="description"
      content="信封预算法个人记账，自建服务器部署，可添加到主屏幕离线打开。"
    />

    <!--
      iOS: Safari does not read the web app manifest for the home-screen experience.
      It needs these non-standard tags, plus an apple-touch-icon at 180x180.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="记账" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />

    <title>记账</title>
    <!--
      The theme preference is applied here, before first paint and before the bundle. The
      build inlines `theme-init.js` at this placeholder; without it the page paints light
      and then snaps to dark, and on a phone that flash is unmissable.
    -->
    <!--theme-init-->
  </head>
  <body>
    <div id="app"></div>
    <!--
      A first-paint placeholder: the bundle is a 40 kB download, and on a slow phone
      connection the alternative is a blank screen. It is replaced the moment Vue
      mounts, and it also tells the user something useful if JS never runs.
    -->
    <noscript>记账需要启用 JavaScript。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
