name: iOS build and IPA

on:
  push:
    paths:
      - 'clients/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'clients/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - name: Test and package unsigned iPhone app
        run: bash clients/ios/scripts/ci-build.sh
      - name: Upload IPA, checksum and simulator launch image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Jizhang-ios-${{ github.run_number }}
          path: clients/ios/build/artifacts/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload test and build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-diagnostics-${{ github.run_number }}
          path: |
            clients/ios/build/logs/
            clients/ios/build/TestResults.xcresult/
          if-no-files-found: warn
          retention-days: 5
          overwrite: true
